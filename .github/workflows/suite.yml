name: suite-verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: symergetics
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: docxology/QuadMath
          ref: main
          path: QuadMath
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: docxology/QuadCraft
          ref: main
          path: QuadCraft
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: QuadCraft/.node-version
      - name: Install verification prerequisites
        run: |
          python -m pip install uv==0.13.7
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify actual repositories and runtimes
        run: python symergetics/verify_suite.py --report '${{ runner.temp }}/suite-receipt.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suite-execution-receipt
          path: ${{ runner.temp }}/suite-receipt.json
          if-no-files-found: error
