name: geometry-verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      MPLBACKEND: Agg
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install reproducible runner
        run: python -m pip install uv==0.13.7
      - name: Install locked scientific and test dependencies
        run: uv sync --frozen --python '${{ matrix.python }}' --extra scientific --extra test
      - name: Tests and coverage gate
        run: uv run --frozen python -m pytest tests/ -q -o 'addopts=--strict-markers --strict-config --cov=symergetics --cov-report=term-missing --cov-fail-under=85'
      - name: Paper source-path and caption controls
        run: uv run --frozen python -m unittest discover -s paper/validation -p test_validate_paper.py
      - name: Real-image renderer regressions
        run: uv run --frozen --with 'reportlab>=4.0.0' --with 'markdown>=3.4.0' --with 'pyyaml>=6.0.0' --with 'matplotlib>=3.5.0' --with 'pypdf>=5.0.0' python -m unittest discover -s paper/render -p test_renderer.py
      - name: Verify actual manuscript assets
        run: |
          uv run --frozen python paper/validation/validate_paper.py --paper-dir paper --output "$RUNNER_TEMP/symergetics-paper-validation.md"
          uv run --frozen python paper/validation/check_images.py --paper-dir paper --output "$RUNNER_TEMP/symergetics-paper-images.md"
      - name: Render the actual paper
        run: uv run --frozen --with 'reportlab>=4.0.0' --with 'markdown>=3.4.0' --with 'pyyaml>=6.0.0' --with 'matplotlib>=3.5.0' python paper/render/run_render.py --paper-dir paper --output-dir "$RUNNER_TEMP/symergetics-paper" --output symergetics-main.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.13'
        with:
          name: symergetics-current-manuscript
          path: |
            ${{ runner.temp }}/symergetics-paper/symergetics-main.pdf
            ${{ runner.temp }}/symergetics-paper-validation.md
            ${{ runner.temp }}/symergetics-paper-images.md
          if-no-files-found: error
      - name: Exercise every standalone scientific demo
        run: uv run --frozen --extra scientific --extra test python run.py --examples-only
      - name: Build wheel, source archive and source-rebuilt wheel with toolchain evidence
        run: |
          package_dir="$RUNNER_TEMP/symergetics-package"
          mkdir -p "$package_dir/original" "$package_dir/rebuilt" "$package_dir/proof" "$package_dir/source"
          uv --version > "$package_dir/proof/runner.txt"
          python --version >> "$package_dir/proof/runner.txt"
          python -m pip freeze > "$package_dir/proof/runner-packages.txt"
          uv venv --python '${{ matrix.python }}' "$RUNNER_TEMP/symergetics-builder"
          python -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml","rb"))["build-system"]["requires"]))' > "$package_dir/proof/build-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/symergetics-builder/bin/python" -r "$package_dir/proof/build-requirements.txt"
          uv pip freeze --python "$RUNNER_TEMP/symergetics-builder/bin/python" > "$package_dir/proof/build-toolchain.txt"
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt --output-file "$package_dir/proof/runtime-constraints.txt"
          uv build --no-build-isolation --python "$RUNNER_TEMP/symergetics-builder/bin/python" --wheel --sdist --out-dir "$package_dir/original"
          tar -xzf "$package_dir"/original/*.tar.gz -C "$package_dir/source"
          uv build --no-build-isolation --python "$RUNNER_TEMP/symergetics-builder/bin/python" --wheel --out-dir "$package_dir/rebuilt" "$package_dir"/source/*
          sha256sum "$package_dir"/original/* "$package_dir"/rebuilt/* | sed "s|$package_dir/||" > "$package_dir/proof/sha256.txt"
      - name: Exercise both minimally installed distributions outside the checkout
        run: |
          package_dir="$RUNNER_TEMP/symergetics-package"
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          cd "$RUNNER_TEMP"
          for kind in original rebuilt; do
            environment="$RUNNER_TEMP/symergetics-$kind"
            uv venv --python '${{ matrix.python }}' "$environment"
            uv pip install --python "$environment/bin/python" --constraint "$package_dir/proof/runtime-constraints.txt" "$package_dir/$kind"/*.whl
            uv pip freeze --python "$environment/bin/python" > "$package_dir/proof/$kind-installed.txt"
            "$environment/bin/python" -I - "$expected_version" > "$package_dir/proof/$kind-consumer.json" <<'PY'
          import json, sys
          from importlib.metadata import version
          from pathlib import Path
          import symergetics
          from fractions import Fraction
          import numpy as np
          from symergetics import SymergeticsNumber as N
          from symergetics.core.coordinates import QuadrayCoordinate as Q
          from symergetics.geometry.polyhedra import Tetrahedron
          assert Path(symergetics.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          installed_version = version("symergetics")
          assert installed_version == sys.argv[1]
          assert Q.from_xyz(2,0,0).as_tuple() == (1,0,0,1)
          assert N.sqrt(10**400).value == 10**200
          assert N.nth_root(Fraction(-8,27), 3).value == Fraction(-2,3)
          shape = Tetrahedron([Q(0,0,0,0), Q(1,0,0,0), Q(0,1,0,0), Q(0,0,1,0)])
          assert shape.centroid_exact() == (Fraction(1,4), Fraction(1,4), Fraction(1,4), Fraction(0))
          assert shape.volume() == Fraction(1,4)
          shape.vertices[1] = Q(2,0,0,0)
          assert shape.volume() == Fraction(1,2)
          assert (N(np.uint64(2**63)) ** Fraction(np.int64(2),1)).value == 2**126
          point = Q(Fraction(np.int64(2**62),1),0,0,0)
          assert point.add(point).as_tuple() == (2**63,0,0,0)
          print(json.dumps({"distribution": "symergetics", "version": installed_version,
                            "python": sys.version, "tetra_volume_after_mutation": str(shape.volume()),
                            "exact_cube_root": str(N.nth_root(Fraction(-8,27), 3).value),
                            "wide_integer_addition": [str(value) for value in point.add(point).as_tuple()]}))
          PY
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: symergetics-distributions-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/symergetics-package/original
            ${{ runner.temp }}/symergetics-package/rebuilt
            ${{ runner.temp }}/symergetics-package/proof
          if-no-files-found: error
