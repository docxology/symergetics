name: geometry-verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      MPLBACKEND: Agg
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install reproducible runner
        run: python -m pip install uv==0.13.7
      - name: Install locked scientific and test dependencies
        run: uv sync --frozen --python '${{ matrix.python }}' --extra scientific --extra test
      - name: Tests and coverage gate
        run: uv run --frozen python -m pytest tests/ -q -o 'addopts=--strict-markers --strict-config --cov=symergetics --cov-report=term-missing --cov-fail-under=85'
      - name: Build source distribution and wheel
        run: uv build --python '${{ matrix.python }}'
      - name: Exercise minimally installed wheel outside the checkout
        run: |
          uv venv --python '${{ matrix.python }}' /tmp/symergetics-wheel
          uv pip install --python /tmp/symergetics-wheel/bin/python dist/*.whl
          /tmp/symergetics-wheel/bin/python -I -c "import symergetics; from importlib.metadata import version; from symergetics.core.coordinates import QuadrayCoordinate; assert symergetics.__version__ == version('symergetics'); assert QuadrayCoordinate.from_xyz(2,0,0).as_tuple() == (1,0,0,1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.13'
        with:
          name: symergetics-distributions
          path: dist/*
          if-no-files-found: error
